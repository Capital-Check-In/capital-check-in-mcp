name: Release Please

# IMPORTANTE: Este workflow usa un Personal Access Token (PAT) para crear pull requests.
# Debes crear un PAT con permisos 'repo' y agregarlo como secreto:
# Settings > Secrets and variables > Actions > New repository secret
# Nombre: RELEASE_PLEASE_TOKEN
# Valor: tu Personal Access Token con permisos 'repo'

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
